<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Hub - log in</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="hub-header"><h1>The Hub &middot; Xpresso production kitchen</h1></header>
  <main>
    <section class="card" style="max-width: 420px">
      <h2>Log in</h2>
      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div id="login-message" class="message error hidden" role="alert"></div>
        <p><button type="submit" id="login-button">Log in</button></p>
      </form>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('login-form');
      var message = document.getElementById('login-message');
      var button = document.getElementById('login-button');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        message.classList.add('hidden');
        button.disabled = true;
        Hub.api('POST', 'api/login', {
          username: document.getElementById('username').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        }).then(function (r) {
          button.disabled = false;
          if (r.status === 200 && r.data && r.data.success) {
            window.sessionStorage.setItem(Hub.TOKEN_KEY, r.data.token);
            window.location.href = 'index.html';
            return;
          }
          message.textContent = (r.data && r.data.message) ? r.data.message : 'Login failed.';
          message.classList.remove('hidden');
        }, function () {
          button.disabled = false;
          message.textContent = 'The server could not be reached.';
          message.classList.remove('hidden');
        });
      });
    })();
  </script>
</body>
</html>
