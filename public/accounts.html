<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounts - The Hub</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="hub-header"><h1>The Hub</h1><nav id="hub-nav" aria-label="Main"></nav></header>
  <main>
    <section class="card" id="acc-create-card">
      <h2>Create a login</h2>
      <p class="muted">For head office and Hub staff only. Franchise stores cannot have Hub accounts.
        A person logs in with all three: username, email and password.</p>
      <form id="acc-form" novalidate autocomplete="off">
        <label for="acc-username">Username</label>
        <input type="text" id="acc-username" maxlength="60" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <p class="muted">3 to 60 characters: letters, digits, dot, underscore or hyphen.</p>
        <label for="acc-email">Email</label>
        <input type="email" id="acc-email" maxlength="190" autocomplete="off" required>
        <label for="acc-password">Password (12 or more characters)</label>
        <input type="text" id="acc-password" autocomplete="new-password" autocapitalize="none" spellcheck="false" required>
        <p><button type="button" class="secondary" id="acc-suggest">Suggest a password</button></p>
        <label for="acc-location">Location</label>
        <select id="acc-location" required><option value="">Loading&hellip;</option></select>
        <p><button type="submit" id="acc-save">Create account</button></p>
        <div id="acc-message" class="message hidden" role="status"></div>
      </form>
    </section>

    <section class="card" id="acc-list-card">
      <h2>Accounts</h2>
      <table>
        <thead><tr><th>Username</th><th>Email</th><th>Location</th><th>Type</th><th>Created</th><th>Status</th><th></th></tr></thead>
        <tbody id="acc-body"><tr><td colspan="7" class="muted">Loading&hellip;</td></tr></tbody>
      </table>
      <div id="acc-list-message" class="message hidden" role="status"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script src="assets/accounts.js"></script>
</body>
</html>
