<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub stock - The Hub</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="hub-header"><h1>The Hub</h1><nav id="hub-nav" aria-label="Main"></nav></header>
  <main>
    <section class="card">
      <h2>Hub stock</h2>
      <p class="muted">On hand = deliveries from head office plus or minus stock counts.</p>
      <div id="location-picker" class="hidden">
        <label for="stock-location">Hub location</label>
        <select id="stock-location"></select>
        <div id="location-fallback" class="hidden">
          <label for="stock-location-id">Hub location id</label>
          <input id="stock-location-id" type="number" min="1" step="1">
          <p><button type="button" id="stock-location-go" class="secondary">Show stock</button></p>
        </div>
      </div>
      <p class="muted" id="stock-meta" role="status">Loading&hellip;</p>
      <div class="table-scroll"><table>
        <thead><tr><th>SKU</th><th>Name</th><th>Unit</th><th class="num">On hand</th></tr></thead>
        <tbody id="stock-body"></tbody>
      </table></div>
    </section>

    <section class="card">
      <h2>Stock count</h2>
      <p class="muted">Enter a count as +12.5, or a correction as -2. Use it for an opening balance or a stock count.</p>
      <form id="adj-form" autocomplete="off">
        <label for="adj-sku">Ingredient</label>
        <select id="adj-sku" required></select>
        <label for="adj-qty">Change (+ in, - out)</label>
        <input id="adj-qty" type="number" step="0.001" min="-100000" max="100000" inputmode="decimal" required>
        <label for="adj-reason">Reason (required, 200 characters at most)</label>
        <input id="adj-reason" maxlength="200" required placeholder="opening balance, stock count">
        <p><button type="submit" id="adj-save">Save stock count</button></p>
      </form>
      <div id="stock-message" role="status"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script src="assets/stock.js"></script>
</body>
</html>
