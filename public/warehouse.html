<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse queue - The Hub</title>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/warehouse.css">
</head>
<body>
  <header class="hub-header"><h1>The Hub</h1><nav id="hub-nav" aria-label="Main"></nav></header>
  <main>
    <section class="card" id="queue-card">
      <h2>Warehouse queue</h2>
      <div id="queue-counts" class="wh-counts" aria-live="polite"></div>
      <p class="muted" id="queue-meta">Loading&hellip;</p>
      <p class="wh-actions">
        <button type="button" id="refresh-btn" class="secondary">Refresh now</button>
        <button type="button" id="print-btn" class="secondary">Print pick list</button>
      </p>
      <div id="queue-message" class="message hidden" role="status"></div>
    </section>

    <section class="card" id="picklist-card">
      <h2>To pull now</h2>
      <p class="muted">Everything waiting or being picked, added up per item. Orders already out for delivery are not included.</p>
      <table>
        <thead><tr><th>SKU</th><th>Item</th><th class="num">Qty</th><th>Unit</th><th>Orders</th></tr></thead>
        <tbody id="picklist-body"></tbody>
      </table>
    </section>

    <section id="queue-orders" aria-label="Open orders"></section>
  </main>
  <script src="assets/app.js"></script>
  <script src="assets/warehouse.js"></script>
</body>
</html>
