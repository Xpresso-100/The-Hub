<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock &amp; ordering - The Hub</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="hub-header"><h1>The Hub</h1><nav id="hub-nav" aria-label="Main"></nav></header>
  <main>
    <section class="card" id="stock-card">
      <h2>Stock status (FinCon)</h2>
      <p class="muted" id="stock-meta">Loading&hellip;</p>
      <table>
        <thead><tr><th>SKU</th><th>Item</th><th>Unit</th><th>Status</th></tr></thead>
        <tbody id="stock-body"></tbody>
      </table>
    </section>

    <section class="card hidden" id="order-card">
      <h2>Order ingredients from HQ (at cost)</h2>
      <p class="muted">Prices are HQ warehouse cost, excl. VAT. Internal transfer - not a VAT invoice.</p>
      <form id="order-form" novalidate>
        <table>
          <thead><tr><th>SKU</th><th>Ingredient</th><th>Unit</th><th class="num">Cost (R)</th><th class="num">Qty</th><th class="num">Line (R)</th></tr></thead>
          <tbody id="ingredient-body"></tbody>
          <tfoot><tr><th colspan="5" class="num">Total (R)</th><th class="num" id="order-total">0.00</th></tr></tfoot>
        </table>
        <label for="delivery-date">Requested delivery date (optional)</label>
        <input type="date" id="delivery-date">
        <label for="order-notes">Notes (optional, max 500)</label>
        <textarea id="order-notes" maxlength="500" rows="2"></textarea>
        <p><button type="submit" id="order-submit">Place order</button></p>
        <div id="order-message" class="message hidden" role="status"></div>
      </form>
    </section>

    <section class="card hidden" id="orders-card">
      <h2 id="orders-title">Order history</h2>
      <div id="orders-filter" class="hidden">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">All</option>
          <option value="pending">pending</option>
          <option value="in_process">in_process</option>
          <option value="out_for_delivery">out_for_delivery</option>
          <option value="delivered">delivered</option>
          <option value="cancelled">cancelled</option>
        </select>
      </div>
      <table>
        <thead><tr><th>#</th><th>Location</th><th>Placed</th><th>Status</th><th class="num">Lines</th><th class="num">Total (R)</th><th></th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
      <div id="orders-message" class="message hidden" role="status"></div>
    </section>

    <section class="card hidden" id="detail-card">
      <h2 id="detail-title">Order</h2>
      <div id="detail-body"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script src="assets/ordering.js"></script>
</body>
</html>
