<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Hub</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="hub-header"><h1>The Hub</h1><nav id="hub-nav" aria-label="Main"></nav></header>
  <main>
    <section class="card">
      <h2 id="welcome">Loading&hellip;</h2>
      <p class="muted">Xpresso central production kitchen. Ingredients are ordered from HQ at cost; finished food goes into HQ stock.</p>
    </section>
    <section class="tiles" id="tiles"></section>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      'use strict';
      var TILES = [
        { href: 'ordering.html', title: 'Stock & ordering', text: 'FinCon stock status, order ingredients from HQ at cost, order history.', roles: ['hq', 'hub'] },
        { href: 'ordering.html', title: 'Stock status', text: 'FinCon stock status (in stock / low / out).', roles: ['franchise'] },
        { href: 'recipes.html', title: 'Recipes & batches', text: 'Recipes, record a production batch, ingredient inventory.', roles: ['hq', 'hub'] },
        { href: 'reports.html', title: 'Reports', text: 'Finished goods for HQ, recipe and batch lists.', roles: ['hq', 'hub'] }
      ];
      Hub.me().then(function (user) {
        Hub.renderNav(user);
        document.getElementById('welcome').textContent = 'Welcome, ' + user.username + ' (' + user.location.name + ')';
        document.getElementById('tiles').innerHTML = TILES.filter(function (t) {
          return t.roles.indexOf(user.role) !== -1;
        }).map(function (t) {
          return '<a href="' + Hub.escapeHtml(t.href) + '"><strong>' + Hub.escapeHtml(t.title) + '</strong>' +
            Hub.escapeHtml(t.text) + '</a>';
        }).join('');
      });
    })();
  </script>
</body>
</html>
